<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIM</title>
<meta name="description" content="Open a floor plan or shop drawing, set its scale and take quick measurements in the browser.">
<meta name="theme-color" content="#4a4a4a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lexend+Zetta:wght@500&display=swap">
<style>
/* DIM in Runebender's gray theme (assets/themes/default/gray.theme.toml): base UI stops 00-09, rainbow mark hues,
   radius 6 / panel 10 / control 4, 1px dark outlines, filled points. Layout: dark menu bar, then three rounded panels. */
:root {
  --b00: oklch(0.30 0 0); --b01: oklch(0.36 0 0); --b02: oklch(0.42 0 0); --b03: oklch(0.48 0 0); --b04: oklch(0.54 0 0);
  --b05: oklch(0.60 0 0); --b06: oklch(0.66 0 0); --b07: oklch(0.72 0 0); --b08: oklch(0.78 0 0); --b09: oklch(0.84 0 0);
  --red: oklch(0.61 0.167 27); --orange: oklch(0.68 0.15 46); --yellow: oklch(0.82 0.135 96); --green: oklch(0.69 0.126 152);
  --blue: oklch(0.64 0.119 248); --purple: oklch(0.61 0.15 292); --pink: oklch(0.68 0.15 350);
  --green-deep: oklch(0.43 0.126 152); --red-deep: oklch(0.35 0.167 27);
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --logo: "Lexend Zetta", "JetBrains Mono", ui-sans-serif, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--b05); color: var(--b00); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
button, input, select, summary { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--b00); outline-offset: 1px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; }
.app > * { min-width: 0; }

/* Menu bar */
.bar {
  display: flex; align-items: center; gap: 18px; background: var(--b02); color: var(--b09); min-width: 0;
  padding-block: 6px; padding-top: max(6px, env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.logo { margin: 0; font-family: var(--logo); font-weight: 500; font-size: 17px; letter-spacing: 0; color: var(--b09); line-height: 1; flex: none; }
.menu { display: flex; gap: 2px; flex-wrap: wrap; }
.menu button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 8px; color: var(--b08); }
.menu button:hover { background: var(--b01); color: var(--b09); }
.menu button.on { border-color: var(--b07); color: var(--b09); }
.menu button small { color: var(--b06); font-size: 10px; margin-left: 4px; }
.bar .spacer { flex: 1; }
.bar .doc { min-width: 0; color: var(--b07); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { flex: none; border: 1px solid var(--b06); border-radius: 4px; padding: 1px 7px; color: var(--b08); font-size: 11px; }

/* Panels */
.main { display: grid; grid-template-columns: 264px minmax(0, 1fr) 284px; gap: 8px; padding: 8px; min-height: 0;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.panel { background: var(--b07); border: 1px solid color-mix(in oklch, var(--b00) 45%, transparent); border-radius: 10px; min-height: 0; min-width: 0; box-shadow: 0 1px 0 color-mix(in oklch, var(--b09) 40%, transparent) inset; }
.left, .right { overflow: auto; }
.left { display: flex; flex-direction: column; }
.center { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }

/* Left: tool tabs, live readout, measurement list */
.tools { display: flex; gap: 4px; padding: 10px 10px 8px; border-bottom: 1px solid var(--b00); flex-wrap: wrap; }
.tool { flex: 1; min-width: 38px; height: 30px; display: grid; place-items: center; background: var(--b07); border: 1px solid var(--b00); border-radius: 4px; color: var(--b01); }
.tool:hover { background: var(--b08); }
.tool.on { background: var(--b03); color: var(--b09); }
.block { padding: 10px 12px; border-bottom: 1px solid color-mix(in oklch, var(--b00) 55%, transparent); }
.label { color: var(--b01); font-size: 11.5px; }
.readout { font-size: 30px; line-height: 1.15; font-weight: 500; letter-spacing: -0.02em; color: var(--b00); margin-top: 2px; overflow-wrap: anywhere; }
.readout.dim { color: var(--b03); }
.hint { color: var(--b01); font-size: 11.5px; margin: 6px 0 0; }
.list { display: grid; gap: 4px; margin-top: 8px; }
.item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 18px; gap: 7px; align-items: center; padding: 3px 4px; border-radius: 4px; }
.item:hover, .item:focus-within { background: var(--b08); }
.chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--b00); }
.item input[type="text"] { background: none; border: 1px solid transparent; border-radius: 3px; padding: 2px 4px; min-width: 0; color: var(--b00); }
.item input[type="text"]:hover { border-color: var(--b04); }
.item input[type="text"]:focus { border-color: var(--b00); background: var(--b08); outline: none; }
.item b { font-weight: 500; white-space: nowrap; }
.item button { background: none; border: 0; padding: 0; color: var(--b02); font-size: 15px; line-height: 1; }
.item button:hover { color: var(--red-deep); }
.swatches { margin-top: auto; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid color-mix(in oklch, var(--b00) 55%, transparent); flex-wrap: wrap; align-items: center; color: var(--b01); font-size: 11px; }
.swatches span { display: inline-flex; align-items: center; gap: 5px; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--b00); display: inline-block; }

/* Buttons and fields */
.btn { background: var(--b07); border: 1px solid var(--b00); border-radius: 4px; padding: 4px 9px; color: var(--b00); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--b08); }
.btn.strong { background: var(--b03); color: var(--b09); }
.btn.strong:hover { background: var(--b02); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
select, input[type="text"] { width: 100%; background: var(--b08); border: 1px solid var(--b00); color: var(--b00); border-radius: 4px; padding: 4px 6px; }
label.field { display: grid; gap: 4px; color: var(--b01); font-size: 11.5px; }

/* Right: inspector */
details { border-bottom: 1px solid var(--b00); }
summary { list-style: none; cursor: pointer; padding: 9px 12px; color: var(--b00); display: flex; gap: 8px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "›"; display: inline-block; width: 8px; color: var(--b01); transition: transform .12s; }
details[open] > summary::before { transform: rotate(90deg); }
summary:hover { background: var(--b08); }
.sec { padding: 2px 12px 12px; display: grid; gap: 8px; }
.sec p { margin: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--b01); }
.kv dd { margin: 0; text-align: right; font-weight: 500; }
.err { color: var(--red-deep); }
.ok { color: var(--green-deep); }
kbd { font-family: var(--mono); font-size: 10.5px; background: var(--b08); border: 1px solid var(--b00); border-radius: 3px; padding: 0 4px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; color: var(--b01); }

/* Center: canvas and status bar */
.stage { position: relative; overflow: auto; display: flex; padding: 28px; background: var(--b06);
  background-image: linear-gradient(color-mix(in oklch, var(--b05) 55%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in oklch, var(--b05) 55%, transparent) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: local; border-radius: 9px 9px 0 0; }
.stage.drop { box-shadow: inset 0 0 0 2px var(--b00); }
.art { margin: auto; width: min(100%, 820px); flex: none; }
.art svg { width: 100%; height: auto; display: block; }
.page { position: relative; margin: auto; flex: none; background: #fff; outline: 1px solid var(--b00); box-shadow: 0 8px 28px rgb(0 0 0 / .22); cursor: crosshair; touch-action: none; }
.page.pan { cursor: grab; }
.page.panning { cursor: grabbing; }
.page canvas, .page svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.status { display: flex; align-items: center; gap: 12px; padding: 5px 10px; border-top: 1px solid var(--b00); color: var(--b01); font-size: 11.5px; min-width: 0; }
.status .live { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.status .live b { color: var(--b00); font-weight: 700; }
.status .note { color: var(--b02); white-space: nowrap; }
.zoom { display: flex; align-items: center; gap: 2px; flex: none; }
.zoom button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 1px 7px; color: var(--b00); }
.zoom button:hover { border-color: var(--b00); }
.zoom span { min-width: 46px; text-align: center; }

/* Preview drawings */
.p-ln { stroke: var(--b00); fill: none; stroke-width: 1.25; }
.p-fill { fill: var(--b05); }
.p-dim { stroke: var(--b02); fill: none; stroke-width: 1; }
.p-dimt { fill: var(--b01); font-family: var(--mono); font-size: 11px; }
.p-lbl { fill: var(--b00); font-family: var(--mono); font-size: 12.5px; font-weight: 700; }

@media (max-width: 1080px) {
  .main { grid-template-columns: 240px minmax(0, 1fr); }
  .right { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .app { height: auto; min-height: 100%; }
  .bar { flex-wrap: wrap; row-gap: 4px; }
  .bar .spacer, .pill { display: none; }
  .bar .doc { order: 3; width: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .center { order: -1; }
  .center .stage { height: 60vh; min-height: 360px; }
  .status .note { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="logo">DIM</h1>
    <nav class="menu" aria-label="Modes">
      <button type="button" data-mode="measure" class="on">Measure</button>
      <button type="button" data-mode="layout">Layout<small>preview</small></button>
      <button type="button" data-mode="cut">Cut<small>preview</small></button>
      <button type="button" data-mode="print">Print<small>preview</small></button>
      <button type="button" data-mode="shop">Shop drawing<small>preview</small></button>
    </nav>
    <div class="spacer"></div>
    <div class="doc" id="doc-name">Sample: A-101 First floor plan.pdf</div>
    <span class="pill">Proof of concept</span>
  </header>

  <main class="main">
    <aside class="panel left" aria-label="Tools and measurements">
      <div class="tools" id="tools" role="toolbar" aria-label="Tools"></div>
      <div id="left"></div>
      <div class="swatches" id="legend">
        <span><i style="background:var(--green)"></i>Length</span>
        <span><i style="background:var(--blue)"></i>Run</span>
        <span><i style="background:var(--purple)"></i>Area</span>
        <span><i style="background:var(--orange)"></i>Scale</span>
      </div>
    </aside>

    <section class="panel center" aria-label="Drawing">
      <div class="stage" id="stage"></div>
      <div class="status">
        <span class="live" id="status" aria-live="polite"></span>
        <span class="note">Files stay on this device</span>
        <span class="zoom" id="zoom">
          <button type="button" data-z="out" aria-label="Zoom out">−</button>
          <span id="zl">100%</span>
          <button type="button" data-z="in" aria-label="Zoom in">+</button>
          <button type="button" data-z="fit">Fit</button>
        </span>
      </div>
    </section>

    <aside class="panel right" id="right" aria-label="Inspector"></aside>
  </main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), toolsEl = $('tools'), leftEl = $('left'), rightEl = $('right'), statusEl = $('status'), zoomEl = $('zoom');
  var mode = 'measure';
  var openSecs = { drawing: true, scale: true, totals: true, export: false, keys: false, about: false };

  var ICON = {
    select: '<path d="M4 3l10 6-4.5 1.2L7.5 15z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    hand: '<path d="M6 9V4.5a1 1 0 0 1 2 0V8m0-4.5V3a1 1 0 0 1 2 0v5m0-4a1 1 0 0 1 2 0v4.5m0-3a1 1 0 0 1 2 0V11c0 3-2 5-5 5-2 0-3-1-4.5-3L3.2 10.4a1 1 0 0 1 1.6-1.2L6 10.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
    scale: '<path d="M2 9h14M2 6v6M16 6v6M6 8v2M10 8v2M13 8v2" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    length: '<path d="M4 14L14 4" stroke="currentColor" stroke-width="1.5"/><rect x="1.5" y="12.5" width="4" height="4" fill="currentColor"/><rect x="12.5" y="1.5" width="4" height="4" fill="currentColor"/>',
    run: '<path d="M2.5 14.5L7 6l4.5 6L15.5 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
    area: '<path d="M3 5l9-2 3.5 8-7 4.5L3 12z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    panel: '<rect x="2.5" y="3.5" width="13" height="11" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 3.5v11M11 3.5v11" stroke="currentColor" stroke-width="1.4"/>',
    offset: '<rect x="5" y="5" width="8" height="8" rx="1" fill="currentColor" opacity=".35"/><rect x="2.5" y="2.5" width="13" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/>',
    text: '<path d="M3 4h12M9 4v11" fill="none" stroke="currentColor" stroke-width="1.6"/>',
    trace: '<path d="M3 13c2-6 4-8 6-4s4 2 6-4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="3" cy="13" r="1.4" fill="currentColor"/><circle cx="15" cy="5" r="1.4" fill="currentColor"/>',
    grid: '<rect x="2.5" y="2.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="10.5" y="2.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="10.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="10.5" y="10.5" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.3"/>',
    merge: '<rect x="3" y="2.5" width="12" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 7h6M6 10h4" stroke="currentColor" stroke-width="1.4"/>',
    dim: '<path d="M2 6v6M16 6v6M3 9h12M3 9l2-1.5M3 9l2 1.5M15 9l-2-1.5M15 9l-2 1.5" fill="none" stroke="currentColor" stroke-width="1.3"/>'
  };
  function toolBtn(icon, id, label, on) {
    return '<button type="button" class="tool' + (on ? ' on' : '') + '" data-tool="' + id + '" title="' + label + '" aria-label="' + label + '" aria-pressed="' + (on ? 'true' : 'false') + '"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">' + ICON[icon] + '</svg></button>';
  }
  // Runebender gray theme points: filled squares (corner, green) or circles (smooth/off-curve), with a dark outline.
  function pnt(x, y, kind) {
    var c = { corner: 'var(--green)', smooth: 'var(--blue)', off: 'var(--purple)', sel: 'var(--yellow)' }[kind];
    if (kind === 'corner' || kind === 'sel') return '<rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="8" height="8" fill="' + c + '" stroke="var(--b00)" stroke-width="1"/>';
    return '<circle cx="' + x + '" cy="' + y + '" r="' + (kind === 'off' ? 3.5 : 4.5) + '" fill="' + c + '" stroke="var(--b00)" stroke-width="1"/>';
  }
  function dimH(x1, x2, y, label) {
    return '<path class="p-dim" d="M' + x1 + ' ' + y + 'H' + x2 + 'M' + x1 + ' ' + (y - 5) + 'v10M' + x2 + ' ' + (y - 5) + 'v10"/><text class="p-dimt" x="' + ((x1 + x2) / 2) + '" y="' + (y - 8) + '" text-anchor="middle">' + label + '</text>';
  }
  function dimV(x, y1, y2, label) {
    return '<path class="p-dim" d="M' + x + ' ' + y1 + 'V' + y2 + 'M' + (x - 5) + ' ' + y1 + 'h10M' + (x - 5) + ' ' + y2 + 'h10"/><text class="p-dimt" x="' + (x - 10) + '" y="' + ((y1 + y2) / 2 + 4) + '" text-anchor="end">' + label + '</text>';
  }

  // ---------- Preview modes (pictures of what's planned; not working yet) ----------
  function layoutArt() {
    var s = 2.2, x0 = 90, y0 = 70, W = 288 * s, H = 108 * s, out = '';
    for (var i = 0; i < 6; i++) {
      var px = x0 - 2 * s + i * 53 * s, sel = i === 3, pw = Math.min(54, 292 - i * 53);
      out += '<rect x="' + px + '" y="' + (y0 - 2 * s) + '" width="' + (pw * s) + '" height="' + (112 * s) + '" rx="3" fill="' + (sel ? 'var(--orange)' : 'var(--green)') + '" fill-opacity=".85" stroke="var(--b00)" stroke-width="' + (sel ? 2 : 1) + '"/>';
      out += '<text class="p-lbl" x="' + (px + pw / 2 * s) + '" y="' + (y0 + H / 2 + 4) + '" text-anchor="middle">' + (i + 1) + '</text>';
    }
    out += '<rect class="p-ln" x="' + x0 + '" y="' + y0 + '" width="' + W + '" height="' + H + '" stroke-width="1.5"/>';
    out += pnt(x0, y0, 'corner') + pnt(x0 + W, y0, 'corner') + pnt(x0, y0 + H, 'corner') + pnt(x0 + W, y0 + H, 'corner');
    out += dimH(x0, x0 + W, y0 - 28, '24\'-0"') + dimV(x0 - 28, y0, y0 + H, '9\'-0"') + dimH(x0 - 2 * s, x0 + 52 * s, y0 + H + 36, '54"');
    out += '<text class="p-dimt" x="' + (x0 + W) + '" y="' + (y0 + H + 32) + '" text-anchor="end">1" overlap · 2" bleed · panel 6 trimmed to 27"</text>';
    return '<svg viewBox="0 0 760 380" role="img" aria-label="Mural wall split into six numbered panels">' + out + '</svg>';
  }
  function cutArt() {
    var out = '<path d="M40 40H720M40 340H720" stroke="var(--b02)" stroke-dasharray="6 6"/><text class="p-dimt" x="720" y="32" text-anchor="end">24" roll</text>';
    [170, 380, 590].forEach(function (x, i) {
      var art = 'M' + (x - 60) + ' 230 Q' + (x - 70) + ' 120 ' + x + ' 110 Q' + (x + 75) + ' 115 ' + (x + 62) + ' 190 Q' + (x + 50) + ' 250 ' + (x - 20) + ' 245 Z';
      out += '<path d="' + art + '" class="p-fill" stroke="var(--b00)" stroke-width="1.25"/>';
      out += '<path fill="none" stroke="var(--pink)" stroke-width="2" d="M' + (x - 72) + ' 236 Q' + (x - 84) + ' 106 ' + x + ' 97 Q' + (x + 90) + ' 102 ' + (x + 75) + ' 194 Q' + (x + 62) + ' 263 ' + (x - 22) + ' 258 Z"/>';
      if (i === 1) {
        out += '<path d="M' + (x - 60) + ' 230L' + (x - 70) + ' 120L' + x + ' 110M' + x + ' 110L' + (x + 75) + ' 115L' + (x + 62) + ' 190M' + (x + 62) + ' 190L' + (x + 50) + ' 250L' + (x - 20) + ' 245" stroke="var(--b02)" fill="none"/>';
        out += pnt(x - 70, 120, 'off') + pnt(x + 75, 115, 'off') + pnt(x + 50, 250, 'off');
        out += pnt(x - 60, 230, 'corner') + pnt(x, 110, 'smooth') + pnt(x + 62, 190, 'sel') + pnt(x - 20, 245, 'corner');
      }
    });
    out += '<rect x="52" y="52" width="10" height="10" fill="var(--b00)"/><rect x="698" y="52" width="10" height="10" fill="var(--b00)"/><rect x="52" y="318" width="10" height="10" fill="var(--b00)"/>';
    out += '<text class="p-dimt" x="380" y="322" text-anchor="middle">CutContour · 1/8" offset · 3-up</text>';
    return '<svg viewBox="0 0 760 380" role="img" aria-label="Three stickers with pink cut lines">' + out + '</svg>';
  }
  function printArt() {
    var out = '<rect x="200" y="20" width="360" height="340" fill="#fff" stroke="var(--b00)"/>';
    [['Avery Chen', 'Speaker', 'var(--yellow)'], ['Jordan Blake', 'Attendee', 'var(--green)'], ['Priya Nair', 'Staff', 'var(--purple)'], ['Luis Romero', 'Attendee', 'var(--green)']].forEach(function (n, i) {
      var x = 225 + (i % 2) * 160, y = 45 + Math.floor(i / 2) * 160, sel = i === 0;
      out += '<rect x="' + x + '" y="' + y + '" width="150" height="145" rx="4" fill="' + n[2] + '" fill-opacity=".85" stroke="var(--b00)" stroke-width="' + (sel ? 2 : 1) + '"/>';

    else if (M.tool === 'run') live = M.draft.length ? 'Run <b>' + len(withHover(M.draft)) + '</b> · Enter to finish' : 'Click points along the run';
    else if (M.tool === 'area') live = M.draft.length ? 'Area <b>' + (M.draft.length > 1 ? fmtSqft(sqftOf(polyArea(withHover(M.draft)), M.page)) : '—') + '</b> · click the first point to close' : 'Click the corners of the area';
    else live = 'Drag to move around';
    statusEl.innerHTML = live + ' · ' + (s ? esc(s.label) : 'no scale set');
  }
  function renderAll() { renderTools(); renderPanels(); drawOverlay(); updateStatus(); }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === m); b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'); });
    zoomEl.hidden = m !== 'measure';
    $('legend').hidden = m !== 'measure';
    if (m === 'measure') {
      buildPage(); renderAll();
      requestAnimationFrame(function () { if (M.autoFit) fit(); });
    } else {
      pageEl = canvasEl = baseEl = ovEl = null;
      var c = STATIC[m];
      stage.innerHTML = '<div class="art">' + c.art() + '</div>';
      statusEl.textContent = c.status;
      renderTools(); renderPanels();
    }
  }
  document.querySelectorAll('[data-mode]').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
  if (window.ResizeObserver) new ResizeObserver(function () { if (mode === 'measure' && M.autoFit) fit(); }).observe(stage);
  window.addEventListener('beforeunload', function (e) { if (M.src !== 'sample' && M.items.length) { e.preventDefault(); e.returnValue = ''; } });
  setMode('measure');
})();
</script>
</body>
