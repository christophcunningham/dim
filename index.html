<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIM</title>
<meta name="description" content="Open a floor plan or shop drawing, set its scale and take quick measurements in the browser.">
<meta name="theme-color" content="#121212">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // Theme before first paint: saved choice, else the system setting.
  (function () { var t = ''; try { t = localStorage.getItem('dim-theme') || ''; } catch (e) {} if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lexend+Zetta:wght@500&display=swap">
<style>
/* DIM themes. The b00-b09 stops are used by role: b00 ink, b01-b02 softer ink, b03 strong buttons, b04 hover edges,
   b05 page, b06 canvas area, b07 panels, b08 hover and fields, b09 the opposite of ink. Light and dark swap the ramp. */
:root {
  --b00: oklch(0.17 0 0); --b01: oklch(0.32 0 0); --b02: oklch(0.44 0 0); --b03: oklch(0.26 0 0); --b04: oklch(0.62 0 0);
  --b05: oklch(0.78 0 0); --b06: oklch(0.86 0 0); --b07: oklch(0.985 0 0); --b08: oklch(0.93 0 0); --b09: oklch(1 0 0);
  --line: oklch(0.28 0 0); --bar: #121212; --bar-ink: oklch(0.98 0 0); --bar-ink2: oklch(0.80 0 0); --bar-hover: oklch(0.30 0 0);
  --canvas-ink: #1f1f1f; --canvas-ink2: #474747; --on-yellow: #121212;
  /* Stabila-style brand colors: yellow, black, red, white, laser green */
  --ink-hard: #121212; --strong: #121212; --strong-ink: #ffffff; --strong-hover: #333333;
  --red: oklch(0.59 0.22 27); --orange: oklch(0.70 0.17 50); --yellow: oklch(0.88 0.18 92); --green: oklch(0.80 0.21 146); --laser: oklch(0.84 0.25 145);
  --blue: oklch(0.64 0.119 248); --purple: oklch(0.61 0.15 292); --pink: oklch(0.68 0.15 350); --teal: oklch(0.70 0.11 195);
  --green-deep: oklch(0.48 0.16 146); --red-deep: oklch(0.52 0.21 27);
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --logo: "Lexend Zetta", "JetBrains Mono", ui-sans-serif, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  /* Dark: neutral charcoal with a slight cool cast; the menu bar is the darkest tone */
  --b00: oklch(0.96 0.005 250); --b01: oklch(0.83 0.005 250); --b02: oklch(0.71 0.005 250); --b03: oklch(0.90 0.005 250); --b04: oklch(0.54 0.005 250);
  --b05: oklch(0.285 0.005 250); --b06: oklch(0.31 0.005 250); --b07: oklch(0.345 0.005 250); --b08: oklch(0.40 0.005 250); --b09: oklch(0.27 0.005 250);
  --line: oklch(0.62 0.005 250); --bar: oklch(0.255 0.005 250); --bar-ink: oklch(0.96 0.005 250); --bar-ink2: oklch(0.78 0.005 250); --bar-hover: oklch(0.34 0.005 250);
  --canvas-ink: #eceef0; --canvas-ink2: #c2c5ca;
  --ink-hard: oklch(0.20 0.005 250); --strong: var(--yellow); --strong-ink: #121212; --strong-hover: oklch(0.93 0.15 95);
  --green-deep: oklch(0.84 0.2 146); --red-deep: oklch(0.72 0.19 27);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--b05); color: var(--b00); font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
button, input, select, summary { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 1px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; }
.app > * { min-width: 0; }

/* Menu bar */
.bar {
  display: flex; align-items: center; gap: 18px; background: var(--bar); color: var(--bar-ink); min-width: 0;
  padding-block: 6px; padding-top: max(6px, env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.logo { margin: 0; font-family: var(--logo); font-weight: 500; font-size: 17px; letter-spacing: 0; color: var(--bar-ink); line-height: 1; flex: none; }
.menu { display: flex; gap: 2px; flex-wrap: wrap; }
.menu button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 9px; color: var(--bar-ink2); }
.menu button:hover { background: var(--bar-hover); color: var(--bar-ink); }
.menu button.on { background: var(--yellow); color: var(--on-yellow); font-weight: 700; }
.menu button small { color: var(--bar-ink2); font-size: 10px; margin-left: 4px; }
.bar .spacer { flex: 1; }
.bar .doc { min-width: 0; color: var(--bar-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { flex: none; border: 1px solid var(--bar-ink2); border-radius: 4px; padding: 1px 7px; color: var(--bar-ink2); font-size: 11px; }
.theme { flex: none; margin: 0 -8px 0 -10px; background: none; border: 1px solid transparent; border-radius: 4px; width: 28px; height: 26px; display: grid; place-items: center; color: var(--bar-ink2); }
.theme:hover { background: var(--bar-hover); color: var(--bar-ink); }

/* Panels */
.main { display: grid; grid-template-columns: 264px minmax(0, 1fr) 284px; gap: 8px; padding: 8px; min-height: 0;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.panel { background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 55%, transparent); border-radius: 10px; min-height: 0; min-width: 0; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.left, .right { overflow: auto; }
.left { display: flex; flex-direction: column; }
.center { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }

/* Left: tool tabs, live readout, measurement list */
.tools { display: flex; gap: 3px; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tool { flex: 1; min-width: 30px; height: 30px; display: grid; place-items: center; background: var(--b07); border: 1px solid var(--line); border-radius: 4px; color: var(--b01); }
.tool:hover { background: var(--b08); }
.tool.on { background: var(--yellow); color: var(--on-yellow); border-color: var(--ink-hard); }
.block { padding: 10px 12px; border-bottom: 1px solid color-mix(in oklch, var(--b00) 55%, transparent); }
.label { color: var(--b01); font-size: 11.5px; }
.readout { font-size: 30px; line-height: 1.15; font-weight: 500; letter-spacing: -0.02em; color: var(--b00); margin-top: 2px; overflow-wrap: anywhere; }
.readout.dim { color: var(--b02); }
.hint { color: var(--b01); font-size: 11.5px; margin: 6px 0 0; }
.list { display: grid; gap: 4px; margin-top: 8px; }
.item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 18px; gap: 7px; align-items: center; padding: 3px 4px; border-radius: 4px; }
.item:hover, .item:focus-within { background: var(--b08); }
.chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); }
.item input[type="text"] { background: none; border: 1px solid transparent; border-radius: 3px; padding: 2px 4px; min-width: 0; color: var(--b00); }
.item input[type="text"]:hover { border-color: var(--b04); }
.item input[type="text"]:focus { border-color: var(--b00); background: var(--b08); outline: none; }
.item b { font-weight: 500; white-space: nowrap; }
.item button { background: none; border: 0; padding: 0; color: var(--b02); font-size: 15px; line-height: 1; }
.item button:hover { color: var(--red-deep); }
.swatches { margin-top: auto; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid color-mix(in oklch, var(--b00) 55%, transparent); flex-wrap: wrap; align-items: center; color: var(--b01); font-size: 11px; }
.swatches span { display: inline-flex; align-items: center; gap: 5px; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }

/* Buttons and fields */
.btn { background: var(--b07); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; color: var(--b00); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--b08); }
.btn.strong { background: var(--strong); color: var(--strong-ink); border-color: var(--ink-hard); font-weight: 500; }
.btn.strong:hover:not(:disabled) { background: var(--strong-hover); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
select, input[type="text"] { width: 100%; background: var(--b08); border: 1px solid var(--line); color: var(--b00); border-radius: 4px; padding: 4px 6px; }
label.field { display: grid; gap: 4px; color: var(--b01); font-size: 11.5px; }

/* Right: inspector */
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 9px 12px; color: var(--b00); display: flex; gap: 8px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "›"; display: inline-block; width: 8px; color: var(--b01); transition: transform .12s; }
details[open] > summary::before { transform: rotate(90deg); }
summary:hover { background: var(--b08); }
.sec { padding: 2px 12px 12px; display: grid; gap: 8px; }
.sec p { margin: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--b01); }
.kv dd { margin: 0; text-align: right; font-weight: 500; }
.err { color: var(--red-deep); }
.ok { color: var(--green-deep); }
kbd { font-family: var(--mono); font-size: 10.5px; background: var(--b08); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; color: var(--b01); }

/* Center: canvas and status bar */
.stage { position: relative; overflow: auto; display: flex; padding: 28px; background: var(--b06);
  background-image: linear-gradient(color-mix(in oklch, var(--b05) 55%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in oklch, var(--b05) 55%, transparent) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: local; border-radius: 9px 9px 0 0; }
.stage.drop { box-shadow: inset 0 0 0 2px var(--b00); }
.art { margin: auto; width: min(100%, 820px); flex: none; }
.main.home { grid-template-columns: minmax(0, 1fr); }
.main.home > .left, .main.home > .right { display: none; }
.home-wrap { margin: auto; width: min(100%, 780px); color: var(--b00); }
.home-hero { background: var(--b08); border: 1px solid var(--line); border-radius: 10px; padding: 24px 26px; }
.home-hero h2 { margin: 0 0 6px; font-family: var(--logo); font-weight: 500; font-size: 26px; letter-spacing: .04em; }
.home-hero p { margin: 0 0 12px; color: var(--b01); }
.home-hero ul { margin: 0 0 16px; padding-left: 18px; color: var(--b01); }
.home-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.home-cards > div { background: var(--b07); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.home-cards h3 { margin: 0; font-size: 13px; font-weight: 700; }
.home-cards p { margin: 0; color: var(--b01); font-size: 11.5px; }
@media (max-width: 720px) { .home-cards { grid-template-columns: minmax(0, 1fr); } }
.logo { cursor: pointer; }
.readout.editable { cursor: pointer; border-radius: 4px; }
.readout.editable:hover { background: var(--b08); }
.readout input { width: 6.2em; font: inherit; font-size: 20px; padding: 0 4px; background: var(--b09); border: 1px solid var(--line); border-radius: 4px; color: var(--b00); }
.readout .szx { font-size: 18px; margin: 0 4px; color: var(--b02); }
.empty { margin: auto; max-width: 460px; background: var(--b08); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; color: var(--b00); }
.empty h2 { margin: 0 0 8px; font-size: 16px; font-weight: 500; }
.empty p { margin: 0 0 10px; color: var(--b01); }
.empty ul { margin: 0 0 14px; padding-left: 18px; color: var(--b01); }
.art svg { width: 100%; height: auto; display: block; }
.page { position: relative; margin: auto; flex: none; background: #fff; outline: 1px solid var(--line); box-shadow: 0 8px 28px rgb(0 0 0 / .22); cursor: crosshair; touch-action: none; }
.page.pan { cursor: grab; }
.page.panning { cursor: grabbing; }
.page canvas, .page svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.status { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 6px 10px; border-top: 1px solid var(--line); color: var(--b01); font-size: 11.5px; min-width: 0; }
.status .live { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status .live b { color: var(--b00); font-weight: 700; }
.status .live kbd { margin: 0 2px; }
.status .mid { display: flex; gap: 6px; align-items: center; }
.status .end { justify-self: end; display: flex; gap: 12px; align-items: center; min-width: 0; max-width: 100%; overflow: hidden; }
.status .note { color: var(--b02); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status .zoom { flex: none; }
.zoom { display: flex; align-items: center; gap: 2px; flex: none; }
.zoom button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 1px 7px; color: var(--b00); }
.zoom button:hover { border-color: var(--b00); }
.zoom span { min-width: 46px; text-align: center; }

/* Tools in two rows, row details, quote */
.tools.grid5 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.tools.grid8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.chip.art { width: 18px; height: 18px; background-color: #fff; background-image: var(--art), repeating-conic-gradient(#b9b9b9 0 25%, #f4f4f4 0 50%); background-size: contain, 6px 6px; background-position: center, 0 0; background-repeat: no-repeat, repeat; }
.item-more input.valin { flex: 1 1 100%; background: var(--b08); padding: 3px 5px; font-size: 11.5px; }
.readout.small { font-size: 22px; }
.item-more { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 4px 0 2px 21px; flex-wrap: wrap; }
.item-more select { width: auto; flex: 1; min-width: 0; padding: 2px 4px; font-size: 11.5px; }
.sty { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; flex: 1 1 100%; font-size: 11px; color: var(--b01); }
.sty-l { width: 44px; flex: none; }
.sty-s { width: 44px; flex: none; }
.sty select { flex: 1 1 0; min-width: 0; }
.item .sw { width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 3px; padding: 0; flex: none; }
.item .sw.on { outline: 2px solid var(--line); outline-offset: 1px; }
.item .sw.auto { background: linear-gradient(135deg, var(--green) 0 33%, var(--blue) 33% 66%, var(--purple) 66%); }
.swpick { width: 22px; height: 17px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: none; flex: none; cursor: pointer; }
.item .mini { font-size: 11px; color: var(--b00); background: var(--b07); border: 1px solid var(--b04); border-radius: 3px; padding: 1px 5px; }
.item .mini:hover { color: var(--b00); background: var(--b08); }
.item input.rotin { width: 46px; background: var(--b08); border-color: var(--b04); padding: 1px 4px; font-size: 11px; }
.item-tag { grid-column: 2 / -1; font-size: 10.5px; color: var(--b01); margin-top: -3px; padding-left: 5px; }
.chip.round { border-radius: 50%; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--b00); cursor: pointer; }
.chk input { margin: 0; accent-color: var(--yellow); }
.qlines { width: 100%; border-collapse: collapse; font-size: 12px; }
.qlines td { padding: 4px 0; border-top: 1px solid color-mix(in oklch, var(--b00) 35%, transparent); vertical-align: top; }
.qlines td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; font-weight: 500; }
.qlines em { color: var(--b01); font-style: normal; }
.qlines .qtot td { font-weight: 700; font-size: 14px; border-top: 1.5px solid var(--line); padding-top: 6px; }
.hist { display: flex; gap: 2px; flex: none; }
.hist button { background: none; border: 1px solid transparent; border-radius: 4px; padding: 2px 8px; color: var(--bar-ink2); }
.hist button:hover:not(:disabled) { background: var(--bar-hover); color: var(--bar-ink); }
.hist button:disabled { opacity: .35; }

/* Measure editing */
.page.edit { cursor: default; }
.page.edit.over, .page.over { cursor: move; }
.page.dragging { cursor: grabbing; }
.item { cursor: pointer; }
.item.sel { background: var(--b08); box-shadow: inset 0 0 0 1px var(--line); }
.units { display: inline-flex; border: 2px solid var(--ink-hard); border-radius: 6px; overflow: hidden; flex: none; background: var(--ink-hard); }
.units button { background: none; border: 0; padding: 3px 13px; color: var(--yellow); font-weight: 700; letter-spacing: .05em; font-size: 12px; }
.units button:hover:not(.on) { color: #ffffff; }
.units button.on { background: var(--yellow); color: var(--on-yellow); border-radius: 3px; }
.units.fmt { border: 1px solid var(--line); background: var(--b07); }
.units.fmt button { color: var(--b00); }
.units.fmt button:hover:not(.on) { color: var(--b00); }
.units.fmt button { padding: 3px 9px; font-weight: 500; letter-spacing: 0; font-size: 11.5px; }
.units.fmt button + button { border-left-color: var(--line); }
.units.fmt button:hover:not(.on) { background: var(--b08); }
.units.fmt button.on { background: var(--strong); color: var(--strong-ink); border-radius: 0; }
/* Left panel: the current tool, its shortcut and what to do next */
.toolcard { padding: 12px 12px 11px; }
.tool-name { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; line-height: 1.2; color: var(--b00); }
.tool-name kbd { font-size: 11.5px; font-weight: 700; padding: 1px 6px; }
.tip { margin: 6px 0 0; color: var(--b00); font-size: 12.5px; line-height: 1.45; }
.tip b { font-weight: 700; }
.tip .sub { display: block; color: var(--b01); font-size: 11.5px; margin-top: 3px; }
.tip.big { font-size: 14px; }
.drops { margin: 6px 0 0; font-size: 15px; font-weight: 700; color: var(--b00); }
.drops small { display: block; font-size: 11.5px; font-weight: 400; color: var(--b01); }
/* Icon toggles: align, bold, dashed */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; flex: none; }
.ib { width: 26px; height: 22px; display: grid; place-items: center; background: var(--b07); border: 0; padding: 0; color: var(--b00); }
.ib + .ib { border-left: 1px solid var(--line); }
.ib:hover { background: var(--b08); }
.ib.on { background: var(--yellow); color: var(--on-yellow); }
.ib:disabled { opacity: .35; cursor: default; background: var(--b07); }

/* Layout */
.lay-canvas { display: block; margin: auto; flex: none; }
.sheet { display: block; margin: auto; flex: none; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.18); touch-action: none; user-select: none; }
.item .sw.none { background: linear-gradient(135deg, #fff 0 45%, var(--red) 45% 55%, #fff 55%); }
textarea.stext { width: 100%; flex: 1 1 100%; background: var(--b08); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; color: var(--b00); resize: vertical; }
.tool.txt { flex: 1 1 auto; width: auto; min-width: 0; padding: 0 8px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.item.ro { grid-template-columns: 14px minmax(0, 1fr) auto 0; padding: 4px; }
.ed { border: 1px solid transparent; border-radius: 6px; padding: 5px; display: grid; gap: 5px; cursor: pointer; }
.ed:hover { background: var(--b08); }
.ed.sel { border-color: var(--line); background: var(--b08); }
.ed-top { display: grid; grid-template-columns: 14px minmax(0, 1fr) 18px; gap: 7px; align-items: center; }
.ed-top button { background: none; border: 0; padding: 0; color: var(--b02); font-size: 15px; line-height: 1; }
.ed-top button:hover { color: var(--red-deep); }
.ed input[type="text"] { background: var(--b08); padding: 3px 5px; }
.ed-top input[type="text"] { background: none; border-color: transparent; font-weight: 500; }
.ed-top input[type="text"]:hover { border-color: var(--b04); }
.ed-top input[type="text"]:focus { border-color: var(--b00); background: var(--b08); }
.ed-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding-left: 21px; }
.ed-nums.two { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.ed-nums label { display: grid; gap: 2px; font-size: 10.5px; color: var(--b01); }
.ed-out { padding-left: 21px; font-size: 11px; color: var(--b01); }
.ed-nums .ed-out { padding: 0 0 4px; }
.ed-nums.one { grid-template-columns: minmax(0, 1fr); }
.ed-out.spacing { line-height: 1.5; }
.ed-out.warn { color: var(--red); line-height: 1.5; }
.ed-out.spacing b { font-weight: 600; color: var(--b00); }

    function keepLogo() { try { if (logo) localStorage.setItem('dim-logo', JSON.stringify(logo)); else localStorage.removeItem('dim-logo'); } catch (e) {} }
    try { setLogo(JSON.parse(localStorage.getItem('dim-logo') || 'null')); } catch (e) {}

    // ---- PDF: the same shapes, drawn with pdf-lib ----
    function exportPdf() {
      if (busy) return;
      busy = true; note = 'Making the PDF…'; right(); fitFigs();
      var built = prims(true), g = built.g, PL, doc, pg;
      Promise.all([getPdfLib(), renderView(sharpness(300 / 72, 16e6))]).then(function (r) {
        PL = r[0]; var vr = r[1];
        return PL.PDFDocument.create().then(function (d) {
          doc = d; pg = doc.addPage([g.W, g.H]);
          doc.setTitle(pdfText(S.tb.title || defaultTitle())); doc.setCreator('DIM');
          var jpg = vr.empty ? null : new Promise(function (res, rej) { vr.canvas.toBlob(function (b) { if (b) b.arrayBuffer().then(res); else rej(new Error('the drawing is too large for this browser')); }, 'image/jpeg', 0.95); }).then(function (b) { return doc.embedJpg(b); });
          var used = {}; built.P.forEach(function (p) { if (p.k === 'text') used[fontOf(p.font, p.bold, p.ital)] = 1; });
          var names = Object.keys(used);
          return Promise.all([Promise.all(names.map(function (nm) { return doc.embedFont(PL.StandardFonts[nm]); })).then(function (fs) { var o = {}; names.forEach(function (nm, i) { o[nm] = fs[i]; }); return o; }), jpg, logo ? doc.embedPng(logo.url) : null]);
        });
      }).then(function (e) {
        var fonts = e[0], viewImg = e[1], logoImg = e[2];
        var Y = function (y) { return g.H - y; }, C = function (h) { var a = hexArr(h); return PL.rgb(a[0], a[1], a[2]); };
        built.P.forEach(function (p) {
          if (p.k === 'rect') pg.drawRectangle({ x: p.x, y: Y(p.y + p.h), width: p.w, height: p.h, color: p.fill ? C(p.fill) : undefined, borderColor: p.stroke ? C(p.stroke) : undefined, borderWidth: p.stroke ? p.sw : 0, borderDashArray: p.dash || undefined });
          else if (p.k === 'ellipse') pg.drawEllipse({ x: p.cx, y: Y(p.cy), xScale: p.rx, yScale: p.ry, color: p.fill ? C(p.fill) : undefined, borderColor: p.stroke ? C(p.stroke) : undefined, borderWidth: p.stroke ? p.sw : 0, borderDashArray: p.dash || undefined });
          else if (p.k === 'line' && p.stroke) pg.drawLine({ start: { x: p.x1, y: Y(p.y1) }, end: { x: p.x2, y: Y(p.y2) }, thickness: p.sw, color: C(p.stroke), dashArray: p.dash || undefined, lineCap: PL.LineCapStyle ? PL.LineCapStyle.Round : undefined });
          else if (p.k === 'poly' && p.fill) pg.drawSvgPath('M ' + p.pts.map(function (q) { return q.x.toFixed(2) + ' ' + q.y.toFixed(2); }).join(' L ') + ' Z', { x: 0, y: g.H, color: C(p.fill), borderWidth: 0 });
          else if (p.k === 'path') pg.drawSvgPath(p.d, { x: p.x, y: Y(p.y), scale: p.sc, color: p.fill ? C(p.fill) : undefined, borderColor: p.stroke ? C(p.stroke) : undefined, borderWidth: p.stroke ? p.sw / p.sc : 0 });
          else if (p.k === 'text' && p.text) pg.drawText(pdfText(p.text), { x: p.x, y: Y(p.y), size: p.size, font: fonts[fontOf(p.font, p.bold, p.ital)], color: C(p.color) });
          else if (p.k === 'image' && p.src === 'view' && viewImg) pg.drawImage(viewImg, { x: p.x, y: Y(p.y + p.h), width: p.w, height: p.h });
          else if (p.k === 'image' && p.src === 'logo' && logoImg) pg.drawImage(logoImg, { x: p.x, y: Y(p.y + p.h), width: p.w, height: p.h });
        });
        return doc.save();
      }).then(function (bytes) {
        var name = (S.tb.project || S.tb.title || defaultTitle() || 'Shop drawing').replace(/[\\/:*?"<>|]+/g, ' ').trim();
        saveBlob(new Blob([bytes], { type: 'application/pdf' }), name + ' shop drawing.pdf');
        busy = false; note = 'Shop drawing saved.'; right();
        setTimeout(function () { note = ''; if (mode === 'shop') right(); }, 3000);
      }).catch(function (err) { busy = false; note = 'Could not make the PDF: ' + (err && err.message ? err.message : err); right(); });
    }

    function getState() { return JSON.parse(JSON.stringify(S)); }
    function setState(st) { if (!st) return; S = Object.assign(fresh(), JSON.parse(JSON.stringify(st))); S.tb = Object.assign(fresh().tb, S.tb || {}); S.style = Object.assign(fresh().style, S.style || {}); S.pan = S.pan || { x: 0, y: 0 }; if (sel != null && !noteById(sel)) sel = null; view.key = ''; }
    return { enter: enter, paint: paint, getState: getState, setState: setState, setLogo: setLogo, getLogo: function () { return logo; },
      useSource: function (src) { S.src = src; S.pan = { x: 0, y: 0 }; } };
  })();

  function renderHome() {
    var cont = M.src !== 'none' ? '<button type="button" class="btn strong" data-home="continue">Continue: ' + esc(M.name || 'your drawing') + '</button>' : '';
    stage.innerHTML = '<div class="home-wrap"><div class="home-hero"><h2>DIM</h2><p>Measure plans and photos, lay out murals, film and markers, and make shop drawings, all in your browser. Files stay on this device.</p>' +
      '<p><b>Get started:</b> open a drawing with <b>Open file</b>, or drag and drop it here. Measure’s Drawing panel on the right has the same button.</p>' + FILE_TYPES +
      '<div class="row">' + cont + '<label class="btn' + (cont ? '' : ' strong') + '" for="home-file">Open file</label><input type="file" id="home-file" accept="application/pdf,image/*,.dim,.json" hidden><button type="button" class="btn" data-home="blank">Start a blank canvas</button><button type="button" class="btn" data-home="sample">Try the sample plan</button></div></div>' +
      '<div class="home-cards"><div><h3>Measure</h3><p>Set the scale, then measure lengths, curves, areas and counts. Snap to the drawing’s lines and mark up photos.</p><div><button type="button" class="btn" data-home="measure">Go to Measure</button></div></div>' +
      '<div><h3>Layout</h3><p>Split murals into panels, lay out privacy film, and nest distraction markers on the roll, with quotes.</p><div><button type="button" class="btn" data-home="layout">Go to Layout</button></div></div>' +
      '<div><h3>Shop drawing</h3><p>Put a drawing or layout on a sheet with your title block, logo, scale bar, text and shapes. Export a PDF.</p><div><button type="button" class="btn" data-home="shop">Go to Shop drawing</button></div></div></div></div>';
    $('home-file').addEventListener('change', function (e) { openFile(e.target.files && e.target.files[0]); e.target.value = ''; });
    stage.querySelectorAll('[data-home]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.home;
        if (a === 'continue') setMode('measure'); else if (a === 'blank') newBlank(); else if (a === 'sample') { setMode('measure'); useSample(); } else setMode(a);
      });
    });
    statusEl.textContent = M.src !== 'none' ? 'Home · ' + M.name + ' is open' : 'Home';
  }
  function setMode(m) {
    mode = m;
    document.querySelector('.main').classList.toggle('home', m === 'home');
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === m); b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'); });
    zoomEl.hidden = m !== 'measure';
    stage.style.cursor = '';
    $('unitbar').hidden = m === 'home';
    $('legend').hidden = m !== 'measure';
    if (m === 'measure') {
      buildPage(); renderAll();
      requestAnimationFrame(function () { if (M.autoFit) fit(); });
    } else if (m === 'layout') {
      pageEl = canvasEl = baseEl = ovEl = null;
      stage.innerHTML = '';
      Lay.enter();
    } else if (m === 'shop') {
      pageEl = canvasEl = baseEl = ovEl = null;
      Shop.enter();
    } else {
      pageEl = canvasEl = baseEl = ovEl = null;
      renderHome();
    }
  }
  document.querySelectorAll('[data-mode]').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
  document.querySelector('.logo').addEventListener('click', function () { setMode('home'); });
  function paintUnits() { $('units').querySelectorAll('[data-u]').forEach(function (b) { b.classList.toggle('on', b.dataset.u === UNITS); b.setAttribute('aria-pressed', b.dataset.u === UNITS ? 'true' : 'false'); }); }
  $('units').addEventListener('click', function (e) {
    var b = e.target.closest('[data-u]'); if (!b || b.dataset.u === UNITS) return;
    UNITS = b.dataset.u; try { localStorage.setItem('dim-units', UNITS); } catch (err) {}
    paintUnits(); rerender();
  });
  paintUnits();
  function rerender() { if (mode === 'measure') { renderPanels(); renderOverlay(); } else if (mode === 'layout') Lay.enter(); else if (mode === 'shop') Shop.enter(); }
  function paintFmt() { $('fmt').querySelectorAll('[data-f]').forEach(function (b) { b.classList.toggle('on', b.dataset.f === FMT); b.setAttribute('aria-pressed', b.dataset.f === FMT ? 'true' : 'false'); }); }
  $('fmt').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]'); if (!b || b.dataset.f === FMT) return;
    FMT = b.dataset.f; try { localStorage.setItem('dim-fmt', FMT); } catch (err) {}
    paintFmt(); rerender();
  });
  paintFmt();
  // Light and dark themes: remembered in this browser; until you pick one, DIM follows the system.
  // One icon for both themes: your day-night mark (sun rays on the left, crescent on the right).
  var HALF = '<svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><line x1="121" y1="40" x2="121" y2="32"/><line x1="64" y1="64" x2="56" y2="56"/><line x1="64" y1="192" x2="56" y2="200"/><line x1="40" y1="128" x2="32" y2="128"/><line x1="121" y1="216" x2="121" y2="224"/></g><path fill="currentColor" d="M137 57.6c-35.3 0-64 30.7-64 66s29 63.9 64 68 77-24.6 77-68-35.3-66-77-66zM130.4 179.6c-24.2-3.1-33-14.4-35-14.8 19.8 2.8 46-8.6 54.9-33.3s-7.3-56.5-32.3-63.6c5.8-1.1 15.1-4.4 26.9-2.9 31.6 4 54 33 50.1 64.6-4 31.6-33 54.1-64.6 50.1z"/></svg>';
  function paintTheme() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark', b = $('theme');
    b.innerHTML = HALF; b.title = dark ? 'Light theme' : 'Dark theme'; b.setAttribute('aria-label', b.title);
    var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', dark ? '#26282b' : '#121212');
  }
  $('theme').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('dim-theme', t); } catch (err) {}
    paintTheme(); if (mode === 'layout') Lay.draw();
  });
  paintTheme();
  if (window.ResizeObserver) new ResizeObserver(function () { if (mode === 'measure' && M.autoFit) fit(); else if (mode === 'layout') Lay.draw(); else if (mode === 'shop') Shop.paint(); }).observe(stage);
  window.addEventListener('beforeunload', function (e) { if (M.src !== 'sample' && M.items.length) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || typing(e)) return;
    var k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); if (e.shiftKey) History.redo(); else History.undo(); }
    else if (k === 'y') { e.preventDefault(); History.redo(); }
    else if (k === 's') { e.preventDefault(); Project.save(); }
    else if (k === '0') { e.preventDefault(); if (mode === 'measure') fit(); else if (mode === 'layout') Lay.draw(); else if (mode === 'shop') Shop.paint(); }
  });
  $('undo').addEventListener('click', function () { History.undo(); });
  $('redo').addEventListener('click', function () { History.redo(); });
  setMode('measure');
  buildSnaps(1);
  History.reset();
  // Start on Home; anything kept in this browser is restored first so Home can offer to continue it.
  Autosave.load().then(function (rec) {
    if (rec && rec.state && rec.state.app === 'DIM') return restoreState(rec.state, rec.file || null, rec.img || null, 'Picked up where you left off.');
  }).catch(function () {}).then(function () { setMode('home'); });
})();
