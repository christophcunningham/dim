<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIM</title>
<meta name="description" content="Open a floor plan or shop drawing, set its scale and take quick measurements in the browser.">
<meta name="theme-color" content="#121212">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="DIM">
<script>
  // Theme before first paint: saved choice, else the system setting.
  (function () { var t = ''; try { t = localStorage.getItem('dim-theme') || ''; } catch (e) {} if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Lexend+Zetta:wght@500&display=swap">
<style>
/* DIM themes. The b00-b09 stops are used by role: b00 ink, b01-b02 softer ink, b03 strong buttons, b04 hover edges,
   b05 page, b06 canvas area, b07 panels, b08 hover and fields, b09 the opposite of ink. Light and dark swap the ramp. */
:root {
  --b00: oklch(0.17 0 0); --b01: oklch(0.32 0 0); --b02: oklch(0.44 0 0); --b03: oklch(0.26 0 0); --b04: oklch(0.62 0 0);
  --b05: oklch(0.78 0 0); --b06: oklch(0.86 0 0); --b07: oklch(0.985 0 0); --b08: oklch(0.93 0 0); --b09: oklch(1 0 0);
  --line: oklch(0.28 0 0); --bar: #121212; --bar-ink: oklch(0.98 0 0); --bar-ink2: oklch(0.80 0 0); --bar-hover: oklch(0.30 0 0);
  --canvas-ink: #1f1f1f; --canvas-ink2: #474747; --on-yellow: #121212;
  /* Stabila-style brand colors: yellow, black, red, white, laser green */
  --ink-hard: #121212; --strong: #121212; --strong-ink: #ffffff; --strong-hover: #333333;
  --red: oklch(0.59 0.22 27); --orange: oklch(0.70 0.17 50); --yellow: oklch(0.88 0.18 92); --green: oklch(0.80 0.21 146); --laser: oklch(0.84 0.25 145);
  --blue: oklch(0.64 0.119 248); --purple: oklch(0.61 0.15 292); --pink: oklch(0.68 0.15 350); --teal: oklch(0.70 0.11 195);
  --green-deep: oklch(0.48 0.16 146); --red-deep: oklch(0.52 0.21 27);
  --ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --logo: "Lexend Zetta", "Manrope", ui-sans-serif, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  /* Dark: neutral charcoal with a slight cool cast; the menu bar is the darkest tone */
  --b00: oklch(0.96 0.005 250); --b01: oklch(0.83 0.005 250); --b02: oklch(0.71 0.005 250); --b03: oklch(0.90 0.005 250); --b04: oklch(0.54 0.005 250);
  --b05: oklch(0.285 0.005 250); --b06: oklch(0.31 0.005 250); --b07: oklch(0.345 0.005 250); --b08: oklch(0.40 0.005 250); --b09: oklch(0.27 0.005 250);
  --line: oklch(0.62 0.005 250); --bar: oklch(0.255 0.005 250); --bar-ink: oklch(0.96 0.005 250); --bar-ink2: oklch(0.78 0.005 250); --bar-hover: oklch(0.34 0.005 250);
  --canvas-ink: #eceef0; --canvas-ink2: #c2c5ca;
  --ink-hard: oklch(0.20 0.005 250); --strong: var(--yellow); --strong-ink: #121212; --strong-hover: oklch(0.93 0.15 95);
  --green-deep: oklch(0.84 0.2 146); --red-deep: oklch(0.72 0.19 27);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--b05); color: var(--b00); font-family: var(--ui); font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, summary { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 1px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100%; }
.app > * { min-width: 0; }

/* Menu bar */
.bar {
  display: flex; align-items: center; gap: 18px; background: var(--bar); color: var(--bar-ink); min-width: 0;
  padding-block: 6px; padding-top: max(6px, env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.logo { margin: 0; font-family: var(--logo); font-weight: 500; font-size: 17px; letter-spacing: 0; color: var(--bar-ink); line-height: 1; flex: none; }
.menu { display: flex; gap: 2px; flex-wrap: wrap; }
.menu button { background: none; border: 1px solid transparent; border-radius: 2px; padding: 3px 9px; color: var(--bar-ink2); }
.menu button:hover { background: var(--bar-hover); color: var(--bar-ink); }
.menu button.on { background: var(--yellow); color: var(--on-yellow); font-weight: 700; }
.menu button small { color: var(--bar-ink2); font-size: 10px; margin-left: 4px; }
.bar .spacer { flex: 1; }
.bar .doc { min-width: 0; color: var(--bar-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { flex: none; border: 1px solid var(--bar-ink2); border-radius: 2px; padding: 1px 7px; color: var(--bar-ink2); font-size: 11px; }
.theme { flex: none; margin: 0 -8px 0 -10px; background: none; border: 1px solid transparent; border-radius: 2px; width: 28px; height: 26px; display: grid; place-items: center; color: var(--bar-ink2); }
.theme:hover { background: var(--bar-hover); color: var(--bar-ink); }

/* Panels */
.main { display: grid; grid-template-columns: 264px minmax(0, 1fr) 284px; gap: 8px; padding: 8px; min-height: 0;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.panel { background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 55%, transparent); border-radius: 4px; min-height: 0; min-width: 0; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.left, .right { overflow: auto; }
.left { display: flex; flex-direction: column; }
.center { display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; }

/* Left: tool tabs, live readout, measurement list */
.tools { display: flex; gap: 3px; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tool { flex: 1; min-width: 30px; height: 30px; display: grid; place-items: center; background: var(--b07); border: 1px solid var(--line); border-radius: 2px; color: var(--b01); }
.tools.tsets { display: grid; gap: 10px; }
.tset-l { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--b02); margin-bottom: 5px; }
.tset-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.tset .tool { position: relative; height: 32px; }
.tset .tool .tk { position: absolute; right: 2px; bottom: 0; font-size: 8px; font-weight: 700; line-height: 1.2; color: var(--b02); }
.tset .tool.on .tk { color: var(--on-yellow); opacity: .7; }
.tool:hover { background: var(--b08); }
.tool.on { background: var(--yellow); color: var(--on-yellow); border-color: var(--ink-hard); }
.block { padding: 10px 12px; border-bottom: 1px solid color-mix(in oklch, var(--b00) 55%, transparent); }
.label { color: var(--b01); font-size: 11.5px; }
.readout { font-size: 30px; line-height: 1.15; font-weight: 500; letter-spacing: -0.02em; color: var(--b00); margin-top: 2px; overflow-wrap: anywhere; }
.readout.dim { color: var(--b02); }
.hint { color: var(--b01); font-size: 11.5px; margin: 6px 0 0; }
.list { display: grid; gap: 4px; margin-top: 8px; }
.item { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 18px; gap: 7px; align-items: center; padding: 3px 4px; border-radius: 2px; }
.item:hover, .item:focus-within { background: var(--b08); }
.chip { width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--line); }
.item input[type="text"] { background: none; border: 1px solid transparent; border-radius: 2px; padding: 2px 4px; min-width: 0; color: var(--b00); }
.item input[type="text"]:hover { border-color: var(--b04); }
.item input[type="text"]:focus { border-color: var(--b00); background: var(--b08); outline: none; }
.item b { font-weight: 500; white-space: nowrap; }
.item button { background: none; border: 0; padding: 0; color: var(--b02); font-size: 15px; line-height: 1; }
.item button:hover { color: var(--red-deep); }
.swatches { margin-top: auto; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid color-mix(in oklch, var(--b00) 55%, transparent); flex-wrap: wrap; align-items: center; color: var(--b01); font-size: 11px; }
.swatches span { display: inline-flex; align-items: center; gap: 5px; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }

/* Buttons and fields */
.btn { background: var(--b07); border: 1px solid var(--line); border-radius: 2px; padding: 4px 9px; color: var(--b00); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--b08); }
.btn.strong { background: var(--strong); color: var(--strong-ink); border-color: var(--ink-hard); font-weight: 500; }
.btn.strong:hover:not(:disabled) { background: var(--strong-hover); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
select, input[type="text"] { width: 100%; background: var(--b08); border: 1px solid var(--line); color: var(--b00); border-radius: 2px; padding: 4px 6px; }
label.field { display: grid; gap: 4px; color: var(--b01); font-size: 11.5px; }

/* Right: inspector */
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 10px 12px; color: var(--b00); display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "›"; display: inline-block; width: 8px; color: var(--b01); transition: transform .12s; }
details[open] > summary::before { transform: rotate(90deg); }
summary:hover { background: var(--b08); }
.sec { padding: 2px 12px 12px; display: grid; gap: 8px; }
.sec p { margin: 0; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--b01); }
.kv dd { margin: 0; text-align: right; font-weight: 500; }
.err { color: var(--red-deep); }
.ok { color: var(--green-deep); }
kbd { font-family: var(--ui); font-size: 10.5px; background: var(--b08); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; color: var(--b01); }

/* Floating bars over the canvas: squared groups of buttons */
.stage.draw { padding: 52px 28px 64px; }
.stage-wrap { position: relative; min-height: 0; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.fbar { position: absolute; z-index: 6; display: flex; align-items: center; gap: 6px; pointer-events: none; max-width: calc(100% - 20px); flex-wrap: wrap; }
.fbar > * { pointer-events: auto; }
.fbar.tr { top: 10px; right: 14px; justify-content: flex-end; gap: 4px; }
/* Small square boxes, one per action, like a hardware panel */
.sq { position: relative; width: 30px; height: 30px; display: inline-grid; place-items: center; padding: 0; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 35%, transparent); border-radius: 3px; color: var(--b01); box-shadow: 0 1px 2px rgb(0 0 0 / .1); flex: none; }
.sq:hover:not(:disabled) { border-color: color-mix(in oklch, var(--line) 75%, transparent); color: var(--b00); }
.sq:disabled { opacity: .4; }
.sq.on { background: var(--strong); border-color: var(--strong); color: var(--strong-ink); }
.sq .tk { position: absolute; right: 2px; bottom: 0; font-size: 8px; font-weight: 800; line-height: 1.2; }
.sqgap { width: 6px; flex: none; }
.sqx { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; margin-left: 4px; background: var(--strong); color: var(--strong-ink); border: 1px solid var(--strong); border-radius: 3px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 1px 2px rgb(0 0 0 / .12); flex: none; }
.sqx:hover, .sqx.on { background: var(--strong-hover); }
.status .hintx { color: var(--b01); }
.status .hintx b { color: var(--b00); }
.fbar.br { right: 14px; bottom: 12px; justify-content: flex-end; }
.fgroup { display: inline-flex; align-items: center; gap: 1px; padding: 2px; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 40%, transparent); border-radius: 3px; box-shadow: 0 1px 3px rgb(0 0 0 / .14); flex: none; position: relative; }
.fgroup[hidden] { display: none; }
.fbtn { height: 26px; min-width: 26px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; background: none; border: 0; border-radius: 2px; color: var(--b01); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.fbtn.ic { padding: 0; width: 26px; }
.fbtn:hover:not(:disabled) { background: var(--b08); color: var(--b00); }
.fbtn.on { background: var(--strong); color: var(--strong-ink); }
.fbtn em { font-style: normal; font-weight: 600; letter-spacing: .02em; color: inherit; opacity: .75; text-transform: none; }
.fsep { width: 1px; align-self: stretch; margin: 3px 2px; background: color-mix(in oklch, var(--line) 35%, transparent); }
.fgroup select { width: auto; height: 24px; padding: 0 4px; border: 0; background: var(--b08); font-size: 11px; font-weight: 600; border-radius: 2px; }
.fgroup .flab { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--b02); padding: 0 4px 0 6px; }
.fbar .zoom button { height: 26px; min-width: 26px; padding: 0 7px; border: 0; border-radius: 2px; font-size: 11px; font-weight: 700; }
.fbar .zoom button:hover { background: var(--b08); border: 0; }
.fbar .zoom span { min-width: 44px; font-size: 11px; font-weight: 600; }
.fpop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 7; width: 240px; display: grid; gap: 10px; padding: 12px; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 45%, transparent); border-radius: 3px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); text-transform: none; letter-spacing: 0; }
.fpop h4 { margin: 0; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--b02); }
.fpop .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* Wide windows: no title bar; the top-left bar holds DIM, the project and file actions */
body.fl .bar { display: none; }
body.fl .app { grid-template-rows: minmax(0, 1fr); }
.stage.flpad { padding: 52px 28px 64px; }
.stage.flpad.stack { padding-bottom: 100px; }
.fbar.tl { top: 10px; left: 10px; gap: 4px; }
.fbar.tl[hidden] { display: none; }
.fbar.tl label.sq { cursor: pointer; }
.tbox.brand { padding: 0 2px 0 0; gap: 0; }
.tbtn.logo { font-family: var(--logo); font-weight: 500; font-size: 14px; letter-spacing: 0; padding: 0 10px; }
.tbtn.ic { width: 28px; padding: 0; justify-content: center; }
.tbox.doc input { height: 26px; width: 200px; border: 0; background: var(--b08); font-weight: 600; font-size: 12px; padding: 0 8px; }
.tbox.pager { gap: 2px; padding: 0 2px; font-size: 11px; font-weight: 600; }
.dock .pages { display: inline-flex; gap: 1px; }
.dchip.pg.on { background: var(--yellow); color: var(--on-yellow); }
.dchip .ls { display: none; }
.dock.tight .dchip { padding: 0 6px; letter-spacing: .04em; }
.dock.tight .dchip .lf { display: none; }
.dock.tight .dchip .ls { display: inline; }
.main.fl.draw .dk-tool { left: calc(var(--rail) + 32px + var(--tlw, 0px)); top: 18px; }
/* Layout and Shop drawing on wide windows: tools in a rail, their panels as cards the dock opens and closes */
.main.pnl { --rail: 84px; grid-template-columns: var(--rail) auto minmax(0, 1fr) auto; }
.main.pnl.lay { --rail: 0px; column-gap: 0; }
.main.pnl.lay.lc > .center, .main.pnl.lay.rc > .center { margin: 0 4px; }
.main.pnl > .left { display: contents; }
.main.pnl #tools { grid-column: 1; grid-row: 1; align-self: start; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 10px 8px; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 55%, transparent); border-radius: 4px; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.main.pnl.lay #tools, .main.pnl #legend { display: none; }
.main.pnl #left { grid-column: 2; grid-row: 1; width: 330px; min-height: 0; overflow: auto; display: none; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 45%, transparent); border-radius: 4px; box-shadow: 0 6px 22px rgb(0 0 0 / .12); }
.main.pnl.lc #left { display: block; }
.main.pnl > .center { grid-column: 3; grid-row: 1; }
.main.pnl > .right { grid-column: 4; grid-row: 1; width: 330px; display: none; box-shadow: 0 6px 22px rgb(0 0 0 / .12); border-color: color-mix(in oklch, var(--line) 45%, transparent); }
.main.pnl.rc > .right { display: block; }

/* Bottom row over the canvas: the dock (centered in the free space) and the units bar */
.fbar.bottom { left: 10px; right: 14px; bottom: 12px; align-items: flex-end; flex-wrap: nowrap; gap: 8px; max-width: none; }
.fbar.bottom > .fbar.br { position: static; margin-left: auto; max-width: none; flex-wrap: nowrap; flex: none; }
.fbar.bottom.stack { flex-wrap: wrap-reverse; }
.fbar.bottom.stack > .dock { flex-basis: 100%; justify-content: center; }
.dock { margin: 0 auto; flex: 0 1 auto; flex-wrap: nowrap; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.dchip { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; background: none; border: 0; border-radius: 2px; color: var(--b00); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.dchip i { width: 10px; height: 10px; border-radius: 2px; flex: none; outline: 1px solid color-mix(in oklch, var(--line) 40%, transparent); }
.dchip .dn { font-size: 10px; font-weight: 600; letter-spacing: 0; color: var(--b02); }
.dchip:hover { background: var(--b08); }
.dchip.zero { color: var(--b02); }
.dock.has-on .dchip:not(.on) { color: var(--b02); }
.dchip.on { background: var(--strong); color: var(--strong-ink); }
.dchip.on .dn { color: inherit; opacity: .7; }
.dock .flab { padding-left: 4px; }

/* Draw on wide windows: a tool rail, the canvas, and floating cards instead of side panels */
.main.draw { position: relative; --rail: 84px; grid-template-columns: var(--rail) minmax(0, 1fr); }
.main.draw > .right { display: none; }
.main.draw > .left { overflow: visible; }
.main.draw .tools.tsets { padding: 10px 8px; border-bottom: 0; gap: 12px; }
.main.draw .tset-l { text-align: center; }
.main.draw .tset-g { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.main.draw #legend { display: none; }
.main.draw .dk-card, .main.draw.dk-right > .right { position: absolute; z-index: 8; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 45%, transparent); border-radius: 3px; box-shadow: 0 6px 22px rgb(0 0 0 / .16); overflow: auto; }
/* Top left (dock layout): document box with its menu, the selection box, and tool panels dropping down under them */
.main.draw .dk-tool { position: absolute; z-index: 9; top: 18px; left: calc(var(--rail) + 26px); display: grid; gap: 6px; justify-items: start; max-width: calc(100% - var(--rail) - 420px); }
.dk-row { display: flex; gap: 4px; align-items: center; max-width: 100%; }
.tbox { position: relative; height: 30px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 35%, transparent); border-radius: 3px; box-shadow: 0 1px 2px rgb(0 0 0 / .1); min-width: 0; }
.tbox[hidden] { display: none; }
.tbox.doc { padding: 0; }
.tbtn { height: 28px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; background: none; border: 0; border-radius: 2px; font-weight: 600; font-size: 12px; color: var(--b00); min-width: 0; max-width: 260px; }
.tbtn:hover { background: var(--b08); }
.tbtn .dname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbox.sel { border-color: color-mix(in oklch, #3e7bfa 55%, transparent); }
.tbox.sel .label { font-size: 11px; color: var(--b02); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.tbox.sel .readout, .tbox.sel .readout.small { font-size: 13px; font-weight: 700; letter-spacing: 0; margin: 0; white-space: nowrap; line-height: 26px; padding: 0 4px; }
.tbox.sel .readout input { width: 5.5em; font-size: 12px; height: 22px; padding: 0 4px; }
.tbox.sel .readout .szx { font-size: 12px; margin: 0 3px; }
.dmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 210px; display: grid; padding: 4px; background: var(--b07); border: 1px solid color-mix(in oklch, var(--line) 45%, transparent); border-radius: 3px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); }

.for-row b { color: var(--b00); font-weight: 600; }
.for-row .linkish { font-size: 11px; white-space: nowrap; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--b01); text-decoration: underline; cursor: pointer; }
.linkish:hover { color: var(--b00); }
.pb-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 16px 14px; gap: 5px; align-items: center; }
.pb-row.door { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.pb-row select { min-width: 0; font-size: 11px; }
.pb-del { background: none; border: 0; padding: 0; color: var(--b02); font-size: 15px; line-height: 1; }
.pb-del:hover { color: var(--red-deep); }
.pb-dup { display: grid; place-items: center; background: none; border: 0; padding: 0; color: var(--b02); line-height: 0; }
.pb-dup:hover { color: var(--b00); }
.gitem { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
.gitem.sel { border-color: var(--b00); background: var(--b08); }
.gitem-top { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 14px; gap: 7px; align-items: center; }
.gitem-top span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gitem-top button { background: none; border: 0; padding: 0; color: var(--b02); font-size: 15px; line-height: 1; }
.gitem-top button:hover { color: var(--red-deep); }
.tog { display: flex; flex-wrap: wrap; gap: 5px; }
.btn[aria-pressed="true"] { background: var(--strong); color: var(--strong-ink); border-color: var(--strong); }
.btn[aria-pressed="true"]:hover:not(:disabled) { background: var(--strong-hover); }
.item .linkish { font-size: 11px; color: var(--b01); }
.item .linkish:hover { color: var(--b00); }
.pb-joint { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; padding: 0 35px 0 0; font: inherit; font-size: 10px; color: var(--b02); cursor: pointer; }
.pb-joint::before, .pb-joint::after { content: ''; flex: 1; border-top: 1px dashed var(--b04); }
.pb-joint.mull::before, .pb-joint.mull::after { border-top: 2px solid var(--b02); }
.pb-joint:hover { color: var(--b00); }
.pb-add { display: flex; gap: 6px; margin-top: 2px; }
.pb-add .btn { padding: 2px 8px; font-size: 11px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.field.color input { width: 100%; height: 30px; padding: 2px; background: var(--b08); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
.copybox { width: 100%; min-height: 110px; background: var(--b08); color: var(--b00); border: 1px solid var(--line); border-radius: 2px; font-family: var(--ui); font-size: 11px; }

/* Preview drawings */
.p-ln { stroke: var(--b00); fill: none; stroke-width: 1.25; }
.p-fill { fill: var(--b05); }
.p-dim { stroke: var(--b02); fill: none; stroke-width: 1; }
.p-dimt { fill: var(--b01); font-family: var(--ui); font-size: 11px; }
.p-lbl { fill: var(--b00); font-family: var(--ui); font-size: 12.5px; font-weight: 700; }

@media (max-width: 1080px) {
  .main { grid-template-columns: 240px minmax(0, 1fr); }
  .right { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .app { height: auto; min-height: 100%; }
  .bar { flex-wrap: wrap; row-gap: 4px; }
  .bar .spacer, .pill { display: none; }
  .bar .doc { order: 3; width: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .center { order: -1; }
  .center .stage { height: 60vh; min-height: 360px; }
  .status .note { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div class="app">
  <header class="bar">
    <h1 class="logo">DIM</h1>
    <button type="button" class="theme" id="theme" aria-label="Switch theme"></button>
    <nav class="menu" aria-label="Modes">
      <button type="button" data-mode="home">Home</button>
      <button type="button" data-mode="measure" class="on">Draw</button>
      <button type="button" data-mode="layout">Layout</button>
      <button type="button" data-mode="shop">Shop drawing</button>
    </nav>
    <div class="spacer"></div>
    <div class="hist"><button type="button" id="undo" title="Undo (⌘Z)" disabled>↶ Undo</button><button type="button" id="redo" title="Redo (⌘⇧Z)" disabled>↷ Redo</button></div>
    <div class="doc" id="doc-name">No drawing open</div>
  </header>

  <main class="main">
    <aside class="panel left" aria-label="Tools and measurements">
      <div class="tools" id="tools" role="toolbar" aria-label="Tools"></div>
      <div id="left"></div>
      <div class="swatches" id="legend">
        <span><i style="background:var(--green)"></i>Length</span>
        <span><i style="background:var(--blue)"></i>Run</span>
        <span><i style="background:var(--teal)"></i>Curve</span>
        <span><i style="background:var(--purple)"></i>Area</span>
        <span><i style="background:var(--pink)"></i>Count</span>
        <span><i style="background:var(--orange)"></i>Scale</span>
      </div>
    </aside>

    <section class="panel center" aria-label="Drawing">
      <div class="stage-wrap">
        <div class="stage" id="stage"></div>
        <!-- Top left: undo, overlays, dimensions, settings. Bottom right: units, number format, scale or grid, zoom. -->
        <div class="fbar tl" id="fbar-tl" role="toolbar" aria-label="DIM and this project" hidden></div>
        <div class="fbar tr" id="fbar-tr" role="toolbar" aria-label="Canvas actions"></div>
        <div class="fbar bottom">
        <div class="fgroup dock" id="dock" role="toolbar" aria-label="Items and panels" hidden></div>
        <div class="fbar br" id="fbar-br">
          <span class="fgroup" id="fscale" hidden></span>
          <span class="fgroup" id="unitbar">
            <span class="units" id="units" role="group" aria-label="Length units"><button type="button" data-u="in" title="Inches">IN</button><button type="button" data-u="ftin" title="Feet and inches">FT-IN</button><button type="button" class="met" data-u="mm" title="Millimeters">MM</button><button type="button" class="met" data-u="cm" title="Centimeters">CM</button><button type="button" class="met" data-u="m" title="Meters">M</button></span>
            <span class="units fmt" id="fmt" role="group" aria-label="Fractions or decimals"><button type="button" data-f="frac" title="Fractions, to 1/16&quot;">1/16</button><button type="button" data-f="dec" title="Decimals, to 0.001&quot;">.001</button></span>
          </span>
          <span class="fgroup zoom" id="zoom">
            <button type="button" data-z="out" aria-label="Zoom out">−</button>
            <span id="zl">100%</span>
            <button type="button" data-z="in" aria-label="Zoom in">+</button>
            <button type="button" data-z="fit" title="Fit (⌘0)">Fit</button>
          </span>
        </div>
        </div>
      </div>
      <div class="status">
        <span class="live" id="status" aria-live="polite"></span>
        <span class="end"><span class="note">Files stay on this device</span></span>
      </div>
    </section>

    <aside class="panel right" id="right" aria-label="Inspector"></aside>
  </main>
</div>
